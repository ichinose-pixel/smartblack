<!doctype html><meta charset="utf-8"><title>Smartblack responsive QA</title><style>body{font:14px sans-serif;background:#ddd;margin:8px}iframe{display:block;border:0;margin-top:8px;box-shadow:0 0 0 1px #999}button{padding:8px;margin-right:8px}</style><button data-w="390" data-h="844">390 × 844</button><button data-w="320" data-h="568">320 × 568</button><button data-w="375" data-h="667">375 × 667</button><button data-w="844" data-h="390">844 × 390</button><button id="reload">Restart</button><iframe title="Game preview" src="index.html" width="390" height="844"></iframe><script>const f=document.querySelector('iframe');document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{f.width=b.dataset.w;f.height=b.dataset.h;f.src='index.html?t='+Date.now()});document.querySelector('#reload').onclick=()=>f.src='index.html?t='+Date.now();</script>
